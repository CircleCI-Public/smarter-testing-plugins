version: 2.1

executors:
  python:
    docker:
      - image: python:3.12

jobs:
  test:
    executor: python
    steps:
      - checkout
      - run: python -m pip install -r dev-requirements.txt
      - run: python -m pip install --editable .
      - run: pytest

workflows:
  main-workflow:
    jobs:
      - test
