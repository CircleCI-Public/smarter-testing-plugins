version: 2.1

orbs:
  jq: circleci/jq@3.1.0

executors:
  python:
    docker:
      - image: python:3.14
    resource_class: medium.gen2
    working_directory: ~/project/pytest-circleci-coverage

commands:
  setup:
    steps:
      - checkout:
          path: ~/project
      - jq/install
      - run: python -m pip install -r dev-requirements.txt
      - run: python -m pip install --editable .
      # twine 6.1.0+ has built-in trusted publishing support. It relies on the
      # `id` library to mint the OIDC token; id 1.6.0+ knows how to do this on
      # CircleCI (via `circleci run oidc get --root-issuer`).
      - run: python -m pip install --upgrade build twine "id>=1.6.0"

jobs:
  test:
    executor: python
    steps:
      - setup
      - run: pytest
      - run:
          name: integrate with testsuite
          command: |
            circleci testsuite "integration test" --analyze-tests="all"
            cat coverage.json | jq --sort-keys > coveragetmp.json
            mv coveragetmp.json coverage.json

            if git diff --exit-code; then
              echo "Coverage JSON up to date"
            else
              echo "Regenerate coverage JSON locally and check in the changes (see README.md for instructions)"
              exit 1
            fi
      - store_artifacts:
          path: test-reports/
      - store_test_results:
          path: test-reports/

  test-classnames:
    executor: python
    steps:
      - setup
      - run: circleci testsuite "test classnames" --verbose
      - store_artifacts:
          path: test-reports/
      - store_test_results:
          path: test-reports/

  publish:
    executor: python
    steps:
      - setup
      - run:
          name: Build plugin
          command: python -m build
      - run:
          name: Publish plugin
          command: .circleci/publish.sh

workflows:
  main-workflow:
    jobs:
      - test
      - test-classnames
      - publish:
          filters: pipeline.git.branch == "main"
          context:
            - smarter-testing-plugin-publish
          requires:
            - test
            - test-classnames
