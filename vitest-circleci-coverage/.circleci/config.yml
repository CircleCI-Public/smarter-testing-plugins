version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:24.19.0
    resource_class: medium.gen2
    working_directory: ~/project/vitest-circleci-coverage

commands:
  setup:
    steps:
      - checkout:
          path: ~/project
      - run: pnpm install

  set_version:
    steps:
      - run:
          name: Set dynamic version
          command: |
            # Publish as MAJOR.MINOR.<pipeline number>. The MAJOR.MINOR base
            # lives in package.json.
            BASE_VERSION="$(node --print "require('./package.json').version")"
            MAJOR="$(echo "$BASE_VERSION" | cut -d. -f1)"
            MINOR="$(echo "$BASE_VERSION" | cut -d. -f2)"
            TARGET_VERSION="${MAJOR}.${MINOR}.<< pipeline.number >>"
            echo "Setting package version to: ${TARGET_VERSION}"
            npm version --no-git-tag-version "$TARGET_VERSION"

jobs:
  lint:
    executor: node
    steps:
      - setup
      - run: pnpm lint
      - run: pnpm format

  test:
    executor: node
    steps:
      - setup
      - run: pnpm build
      - run: pnpm test
      - run:
          name: integrate with testsuite
          command: |
            pnpm generate:ci

            if git diff --exit-code; then
              echo "Coverage JSON up to date"
            else
              echo "Regenerate coverage JSON locally with 'pnpm generate' and check in the changes"
              exit 1
            fi
      - store_artifacts:
          path: junit/
      - store_test_results:
          path: junit/

  dry-run:
    executor: node
    steps:
      - setup
      - run:
          name: build
          command: pnpm build
      - set_version
      - run: npm publish --dry-run --access public

  publish:
    executor: node
    steps:
      - setup
      - run:
          name: build
          command: pnpm build
      - set_version
      - run:
          name: Publish to npm with trusted publishing
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npm publish --access public

workflows:
  main-workflow:
    jobs:
      - test
      - lint
      - dry-run:
          requires:
            - test
            - lint
          filters: pipeline.git.branch != "main"
      - publish:
          requires:
            - test
            - lint
          context:
            - smarter-testing-plugin-publish
          filters: pipeline.git.branch == "main"
